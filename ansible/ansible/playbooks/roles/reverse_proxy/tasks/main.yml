---
- name: Install nginx
  ansible.builtin.apt:
    name: "{{ reverse_proxy_package }}"
    state: present

- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Apply nginx hardening settings
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: /etc/nginx/conf.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Ensure nginx examples directory exists
  ansible.builtin.file:
    path: "{{ reverse_proxy_examples_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install example reverse-proxy vhost for Python applications
  ansible.builtin.template:
    src: app-reverse-proxy.conf.j2
    dest: "{{ reverse_proxy_examples_dir }}/python-app.conf.example"
    owner: root
    group: root
    mode: "0644"

- name: Ensure directory for per-app reverse-proxy location blocks exists
  ansible.builtin.file:
    path: "{{ reverse_proxy_apps_enabled_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install shared gateway server block that includes per-app location blocks
  ansible.builtin.template:
    src: app-gateway.conf.j2
    dest: /etc/nginx/conf.d/10-app-gateway.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Allow nginx (HTTP/HTTPS) through UFW
  community.general.ufw:
    rule: allow
    name: "Nginx Full"

- name: Ensure nginx is enabled and running
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started
