---
- name: Validate required variables for image-based deployment
  ansible.builtin.assert:
    that:
      - image is defined and image | length > 0
      - image_tag is defined and image_tag | length > 0
      - ci_registry is defined and ci_registry | length > 0
      - registry_username is defined and registry_username | length > 0
      - registry_token is defined and registry_token | length > 0
    fail_msg: >-
      image, image_tag, ci_registry, registry_username and registry_token
      must all be set for deploy_method=image
    quiet: true

- name: Log in to the container registry using the group access token
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      echo "{{ registry_token }}" | docker login "{{ ci_registry }}" --username "{{ registry_username }}" --password-stdin
    executable: /bin/bash
  no_log: true
  changed_when: true

- name: Pull the application image
  ansible.builtin.command:
    cmd: "docker pull {{ image }}:{{ image_tag }}"
  changed_when: true

- name: Log out of the container registry
  ansible.builtin.command:
    cmd: "docker logout {{ ci_registry }}"
  changed_when: true

- name: Write environment file for the containerized application
  ansible.builtin.template:
    src: app-image.env.j2
    dest: "{{ app_deploy_dir }}/.env"
    owner: "{{ app_deploy_system_user }}"
    group: "{{ app_deploy_system_group }}"
    mode: "0640"

- name: Enable and (re)start the containerized application service
  ansible.builtin.systemd_service:
    name: "{{ container_runtime_systemd_unit_name }}@{{ app_name }}.service"
    enabled: true
    state: restarted
    daemon_reload: true
