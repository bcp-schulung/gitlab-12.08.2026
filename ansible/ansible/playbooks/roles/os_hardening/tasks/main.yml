---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages to latest security and bugfix versions
  ansible.builtin.apt:
    upgrade: safe

- name: Install base and hardening packages
  ansible.builtin.apt:
    name: "{{ os_hardening_packages }}"
    state: present

- name: Set the system timezone
  community.general.timezone:
    name: "{{ os_hardening_timezone }}"

- name: Ensure systemd-timesyncd is enabled and running
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    enabled: true
    state: started

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure journald log size limits
  ansible.builtin.template:
    src: journald-limits.conf.j2
    dest: /etc/systemd/journald.conf.d/99-limits.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-journald

- name: Ensure sshd_config.d drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Apply SSH daemon hardening settings
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Set UFW default policy to deny incoming traffic
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set UFW default policy to allow outgoing traffic
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "{{ os_hardening_ssh_port | string }}"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Configure fail2ban jail for sshd
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled and running
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started

- name: Enable periodic apt update and unattended upgrade timers
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Configure local unattended-upgrades overrides
  ansible.builtin.template:
    src: 51unattended-upgrades-local.conf.j2
    dest: /etc/apt/apt.conf.d/51unattended-upgrades-local
    owner: root
    group: root
    mode: "0644"

- name: Ensure unattended-upgrades is enabled and running
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Apply kernel and network hardening sysctl settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-os-hardening.conf
    reload: true
  loop: "{{ os_hardening_sysctl_settings | dict2items }}"

- name: Manage swap space
  when: os_hardening_enable_swap | bool
  block:
    - name: Create swap file
      ansible.builtin.command:
        cmd: "fallocate -l {{ os_hardening_swap_size_mb }}M {{ os_hardening_swap_file_path }}"
        creates: "{{ os_hardening_swap_file_path }}"
      when: ansible_facts.swaptotal_mb == 0

    - name: Set swap file permissions
      ansible.builtin.file:
        path: "{{ os_hardening_swap_file_path }}"
        owner: root
        group: root
        mode: "0600"
      when: ansible_facts.swaptotal_mb == 0

    - name: Format swap file
      ansible.builtin.command:
        cmd: "mkswap {{ os_hardening_swap_file_path }}"
      when: ansible_facts.swaptotal_mb == 0
      changed_when: true

    - name: Enable swap file
      ansible.builtin.command:
        cmd: "swapon {{ os_hardening_swap_file_path }}"
      when: ansible_facts.swaptotal_mb == 0
      changed_when: true

    - name: Persist swap file in fstab
      ansible.posix.mount:
        path: none
        src: "{{ os_hardening_swap_file_path }}"
        fstype: swap
        opts: sw
        state: present

    - name: Configure swappiness
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "{{ os_hardening_swappiness | string }}"
        sysctl_file: /etc/sysctl.d/99-os-hardening.conf
        reload: true
