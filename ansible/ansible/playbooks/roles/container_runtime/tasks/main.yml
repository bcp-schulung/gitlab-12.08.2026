---
- name: Install Docker Engine packages
  ansible.builtin.apt:
    name: "{{ container_runtime_packages }}"
    state: present

- name: Ensure Docker service is enabled and running
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Install instantiated systemd unit template for containerized applications
  ansible.builtin.template:
    src: docker-app@.service.j2
    dest: "/etc/systemd/system/{{ container_runtime_systemd_unit_name }}@.service"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd daemon
