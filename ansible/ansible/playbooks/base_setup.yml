---
# Base configuration for a VM that will host one or more systemd-managed
# Python applications behind an nginx reverse proxy.
#
# This playbook only prepares the host (OS hardening, the Python application
# hosting platform, and the reverse proxy). It does not deploy any specific
# application - that is left to separate, app-specific playbooks/pipelines.
- name: Configure base host for systemd Python applications and reverse proxy
  hosts: app_servers
  become: true
  gather_facts: true

  roles:
    - os_hardening
    - python_app_platform
    - reverse_proxy
